tracks:
  - name: stable
    baseImage: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    upstream:
      datasource: github-releases
      depName: Lidarr/Lidarr
      version: "3.1.6.5079"
    tags:
      - "${version}"
      - "${major}"
      - "${major}.${minor}"
      - latest
    buildArgs:
      RELEASE_BRANCH: master

  - name: prerelease
    baseImage: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    upstream:
      datasource: github-releases
      depName: Lidarr/Lidarr
      version: "3.2.0.5144"
    prerelease: true
    tags:
      - "${version}-prerelease"
      - "${major}-prerelease"
      - "${major}.${minor}-prerelease"
    buildArgs:
      RELEASE_BRANCH: develop
